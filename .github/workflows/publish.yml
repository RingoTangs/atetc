name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"

          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            if [[ "$RELEASE_PRERELEASE" != "true" ]]; then
              echo "Prerelease version $VERSION must use a GitHub prerelease" >&2
              exit 1
            fi
            PRERELEASE="${VERSION#*-}"
            NPM_TAG="${PRERELEASE%%.*}"
            case "$NPM_TAG" in
              alpha | beta | rc) ;;
              *)
                echo "Unsupported npm prerelease tag: $NPM_TAG" >&2
                exit 1
                ;;
            esac
          else
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              echo "Stable version $VERSION must not use a GitHub prerelease" >&2
              exit 1
            fi
            NPM_TAG="latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Check package
        run: pnpm check

      - name: Build package
        run: pnpm build

      - name: Preview package contents
        run: pnpm pack:check

      - name: Install OIDC-compatible npm
        run: npm install --global "npm@>=11.5.1 <12"

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.metadata.outputs.npm_tag }}"
        # 首次创建 npm 包时使用此 secret；配置 Trusted Publisher 后删除这一行。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
